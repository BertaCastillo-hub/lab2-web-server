<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Error | Lab 2</title>
</head>
<body>
<main>
	<h1 th:text="${status == 404 ? 'Página no encontrada' : 'Error de solicitud'}">Página no encontrada</h1>
	<p>El recurso que buscas no existe.</p>
	<p>Estado: <span th:text="${status}">404</span></p>
	<p>Ruta: <span th:text="${path}">/missing</span></p>
</main>
</body>
</html>
