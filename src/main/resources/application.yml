server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:localhost.p12
    key-store-password: "secret"
    key-store-type: PKCS12
    key-alias: localhost
  http2:
    enabled: true
  compression:
    enabled: true
    min-response-size: 1
    mime-types:
      - application/json
      - application/problem+json
      - text/html
      - text/plain