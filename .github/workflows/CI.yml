name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        run: ./gradlew check --no-daemon
      - name: Assemble
        run: ./gradlew assemble --no-daemon
